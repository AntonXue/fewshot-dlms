name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: pip install -e ".[dev,data]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Rebuild SST-2 and MIT Movie text from the public sources
        run: python data/benchmarks/build.py
      - name: Test
        run: make test
