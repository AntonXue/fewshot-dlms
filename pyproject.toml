[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fewshot-dlms"
version = "0.1.0"
description = "Multi-target few-shot prompting with diffusion language models: code and reproduction for the paper"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "torch==2.7.1", "transformers==5.13.0", "numpy==1.26.4", "pandas==2.3.3",
  "matplotlib==3.10.7", "huggingface_hub>=0.30",
]
[project.optional-dependencies]
judge = ["anthropic>=0.40"]
dev = ["pytest>=8"]
# pyarrow 26 needs NumPy 2, but the core dependencies pin numpy==1.26.4.
data = ["datasets>=3", "pyarrow<26"]
# GPU runs: the Triton kernels dQwen3.5's linear-attention layers used in the paper's runs (with fla-core 0.5.1).
# Do not install causal-conv1d: transformers would then switch dQwen to a different convolution kernel.
gpu = ["flash-linear-attention==0.5.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["gpu: needs a CUDA GPU and model weights", "parity: needs fetched artifacts"]
# Third-party warnings: sentencepiece (imported by the tokenizers) is a SWIG extension that warns on import
# under Python 3.12; Nemotron's own configuration code calls a rope helper that transformers 5 deprecates.
filterwarnings = [
  "ignore:builtin type Swig:DeprecationWarning",
  "ignore:`rope_config_validation` is deprecated:FutureWarning",
]
testpaths = ["tests"]
pythonpath = ["."]
